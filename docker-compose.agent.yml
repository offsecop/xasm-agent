services:
  xasm-agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${XASM_AGENT_IMAGE:-xasm-agent:latest}
    container_name: ${XASM_AGENT_CONTAINER:-xasm-agent}
    init: true
    environment:
      AGENT_API_URL: ${AGENT_API_URL:?Set AGENT_API_URL to the platform API URL}
      AGENT_NAME: ${AGENT_NAME:-Remote-Agent}
      AGENT_DESCRIPTION: ${AGENT_DESCRIPTION:-Standalone xASM remote agent}
      AGENT_TAGS: ${AGENT_TAGS:-remote,scanner}
      AGENT_INSTALLATION_UID: ${AGENT_INSTALLATION_UID:-}
      AGENT_ENROLLMENT_ID: ${AGENT_ENROLLMENT_ID:-}
      AGENT_ENROLLMENT_TOKEN: ${AGENT_ENROLLMENT_TOKEN:-}
      AGENT_CLIENT_ID: ${AGENT_CLIENT_ID:-}
      AGENT_CLIENT_SECRET: ${AGENT_CLIENT_SECRET:-}
      AGENT_MAX_CONCURRENT_JOBS: ${AGENT_MAX_CONCURRENT_JOBS:-3}
      AGENT_JOB_EXECUTION_TIMEOUT: ${AGENT_JOB_EXECUTION_TIMEOUT:-300}
    volumes:
      - xasm-agent-state:/var/lib/xasm-agent
    shm_size: ${XASM_AGENT_SHM_SIZE:-1gb}
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  xasm-agent-state:
